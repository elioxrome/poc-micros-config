# Ejecuta exactamente los mismos hooks que pre-commit en local: una sola definición
# de "qué es válido" (.pre-commit-config.yaml), sin que el CI y el portátil diverjan.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - run: pre-commit run --all-files --show-diff-on-failure
