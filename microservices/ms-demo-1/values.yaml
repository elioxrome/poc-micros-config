# Values base de Helm, comunes a todos los entornos.
# Los values.yaml de cada entorno solo llevan diferencias (merge profundo, como Helm).
replicaCount: 1

image:
  repository: registry.example.com/baas/ms-demo-1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: default
  LOG_LEVEL: INFO
